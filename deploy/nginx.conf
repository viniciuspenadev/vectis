# Vectis — nginx dentro do container.
# O HTTPS é feito pelo proxy do Easypanel (Traefik), que encaminha para cá em HTTP na porta 80.

server {
    # Só IPv4: em containers sem IPv6 um "listen [::]:80" impede o nginx de subir.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Atrás do proxy HTTPS: redirecionamentos relativos (sem "http://" nem ":80" na URL).
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Arquivos ocultos (.git, .env etc.) nunca são servidos.
    location ~ /\. {
        return 404;
    }

    # Arquivos com hash no nome (CSS, JS, imagens otimizadas, fontes): cache de 1 ano.
    # "^~" impede que a regra de imagens abaixo capture estes arquivos.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Demais arquivos de public/ (favicons, logo): cache de 7 dias.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Páginas: URLs limpas (/en/ → /en/index.html), sempre revalidadas.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # Formulário de cotação: endpoint ainda não implementado (próxima fase).
    # Quando existir, encaminhar /api/ para o serviço responsável aqui.

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
